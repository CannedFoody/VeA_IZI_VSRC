spring.application.name=VeA_IZI_VSRC
spring.mvc.format.date=yyyy-MM-dd

# MYSQL settings / GVistins
spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/vea_vsrc_izi
spring.datasource.username=user_spring
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name =com.mysql.cj.jdbc.Driver

# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Consumer
spring.kafka.consumer.group-id=izi-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=eu.virac.vea_izi_vsrc.*

# Don't let a missing broker freeze the admin pages (default is 60 s)
spring.kafka.producer.properties.max.block.ms=3000

# Mail (Mailpit from docker-compose, no login needed)
spring.mail.host=localhost
spring.mail.port=1025
app.mail.from=izi-notifications@localhost

