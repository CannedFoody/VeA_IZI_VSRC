<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Details</title>
    <style>
        body { font-family: Arial, sans-serif; background: white; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .content { flex: 1; }
        h1 { text-align: center; margin-top: 30px; font-size: 26px; font-weight: bold; }
        .box { width: 50%; margin: 30px auto; border: 1px solid #ddd; padding: 20px; font-size: 16px; }
        .footer { padding: 20px; font-size: 12px; color: #444; text-align: center; border-top: 1px solid #ddd; }
    </style>
</head>

<body>

<header style="display:flex;align-items:center;justify-content:space-between;padding:12px 25px;border-bottom:1px solid #ddd;">
    <div style="display:flex;align-items:center;gap:15px;">
        <div style="width:40px;height:40px;border-radius:50%;border:1px solid #000;display:flex;align-items:center;justify-content:center;font-size:12px;">Logo</div>
        <div style="font-size:20px;font-weight:bold;">VeA SR Sistēma</div>
    </div>

    <nav style="display:flex;gap:25px;font-size:15px;">
        <span>Access</span>
        <span>Structure</span>
        <span>KPI</span>
        <span style="font-weight:bold;">ADMIN</span>
    </nav>

    <div style="display:flex;align-items:center;gap:15px;">
        <span style="font-size:18px;">🌐</span>
        <span style="font-size:18px;">↪</span>
    </div>
</header>

<div class="content">
    <h1>KPI SEARCH</h1>

    <form th:action="@{/admin/kpi/search}" th:object="${search_params}" method="post">

        <label for="keyword">Keyword</label>
        <input id="keyword" type="text" th:field="*{keyword}">

        <label for="creator">Creator</label>
        <select id="creator" th:field="*{creator}">
            <option value="">Any</option>
            <option th:each="u: ${users}" th:value="${u.idUser}" th:text="${u.name}"></option>
        </select>

        <label for="overlooker">Overlooker</label>
        <select id="overlooker" th:field="*{overlooker}">
            <option value="">Any</option>
            <option th:each="u: ${users}" th:value="${u.idUser}" th:text="${u.name}"></option>
        </select>

        <label for="date">Creation Date</label>
        <input id="date" type="text" th:field="*{creation_date}">

        <label for="deadline">Deadline</label>
        <input id="deadline" type="text" th:field="*{deadline}">

        <label for="category">Category</label>
        <select id="category" th:field="*{category}">
            <option value="">Any</option>
            <option th:each="c: ${categories}" th:value="${c.idCategory}" th:text="${c.name}"></option>
        </select>

        <button type="submit">Search</button>

    </form>
</div>

<div class="footer">
    <div>Director: Isaac Newton</div>
    <div>Office Manager: Marie Curie</div>
</div>

</body>
</html>
