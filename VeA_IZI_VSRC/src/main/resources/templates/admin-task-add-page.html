<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Task</title>
    <style>
        body { font-family: Arial, sans-serif; background: white; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; } 
		.content { flex: 1; } h1 { text-align: center; margin-top: 30px; font-size: 26px; font-weight: bold; } 
		form { width: 60%; margin: 30px auto; border: 1px solid #ddd; padding: 20px; font-size: 16px; } 
		input, textarea, select { width: 100%; padding: 8px; margin-bottom: 15px; } 
		button { padding: 10px 20px; background: black; color: white; border: none; cursor: pointer; } 
		.footer { padding: 20px; font-size: 12px; color: #444; text-align: center; border-top: 1px solid #ddd; }
    </style>
</head>

<body>

<header style="display:flex;align-items:center;justify-content:space-between;padding:12px 25px;border-bottom:1px solid #ddd;">
    <div style="display:flex;align-items:center;gap:15px;">
        <div style="width:40px;height:40px;border-radius:50%;border:1px solid #000;display:flex;align-items:center;justify-content:center;font-size:12px;">Logo</div>
        <div style="font-size:20px;font-weight:bold;">VeA SR Sistēma</div>
    </div>

    <nav style="display:flex;gap:25px;font-size:15px;">
        <span>Access</span>
        <span>Structure</span>
        <span>KPI</span>
        <span style="font-weight:bold;">ADMIN</span>
    </nav>

    <div style="display:flex;align-items:center;gap:15px;">
        <span style="font-size:18px;">🌐</span>
        <span style="font-size:18px;">↪</span>
    </div>
</header>

<div class="content">
    <h1>ADD TASK</h1>

    <form th:action="@{/admin/task/add}" th:object="${task}" method="post">

        <label>Title</label>
        <input type="text" th:field="*{title}" />

        <label>Description</label>
        <textarea th:field="*{description}"></textarea>

        <label>Status</label>
        <select th:field="*{status}">
            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
        </select>

        <label>KPI</label>
        <select th:field="*{kpi}">
            <option th:each="k : ${kpis}" th:value="${k}" th:text="${k.title}"></option>
        </select>

        <label>SubCategory</label>
        <select th:field="*{subCategory}">
            <option th:each="s : ${subcategories}" th:value="${s}" th:text="${s.title}"></option>
        </select>

        <button type="submit">Add</button>
    </form>
</div>

<div class="footer">
    <div>Director: Isaac Newton</div>
    <div>Office Manager: Marie Curie</div>
</div>

</body>
</html>
