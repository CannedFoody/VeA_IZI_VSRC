<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All KPIs</title>
    <style>
        body { font-family: Arial, sans-serif; background: white; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; } 
        .content { flex: 1; } 
        h1 { text-align: center; margin-top: 30px; font-size: 26px; font-weight: bold; } 
        table { width: 90%; margin: 20px auto 40px auto; border-collapse: collapse; font-size: 14px; } 
        th, td { border: 1px solid #ddd; padding: 10px; } 
        th { background: #f5f5f5; } 
        a.btn { padding: 6px 12px; background: black; color: white; text-decoration: none; border-radius: 4px; } 
        .footer { padding: 20px; font-size: 12px; color: #444; text-align: center; border-top: 1px solid #ddd; }
    </style>
</head>

<body>

<header style="display:flex;align-items:center;justify-content:space-between;padding:12px 25px;border-bottom:1px solid #ddd;">
    <div style="display:flex;align-items:center;gap:15px;">
        <div style="width:40px;height:40px;border-radius:50%;border:1px solid #000;display:flex;align-items:center;justify-content:center;font-size:12px;">Logo</div>
        <div style="font-size:20px;font-weight:bold;">VeA SR Sistēma</div>
    </div>

    <nav style="display:flex;gap:25px;font-size:15px;">
        <span>Access</span>
        <span>Structure</span>
        <span>KPI</span>
        <span style="font-weight:bold;">ADMIN</span>
    </nav>

    <div style="display:flex;align-items:center;gap:15px;">
        <span style="font-size:18px;">🌐</span>
        <span style="font-size:18px;">↪</span>
    </div>
</header>

<div class="content">
    <h1>ALL KPIs</h1>

    <table>
        <tr>
            <th>ID</th>
            <th>Creation Date</th>
            <th>Deadline</th>
            <th>Title</th>
            <th>Description</th>
            <th>Status</th>
            <th>Category</th>
            <th>Creator</th>
            <th>Overlooker</th>
            <th>Actions</th>
        </tr>

        <tr th:each="k : ${package}">
            <td th:text="${k.idKPI}"></td>
            <td th:text="${k.creationDate}"></td>
            <td th:text="${k.deadline}"></td>
            <td th:text="${k.title}"></td>
            <td th:text="${k.description}"></td>
            <td th:text="${k.status}"></td>
            <td th:text="${k.category.name}"></td>
			<td th:text="${k.creator.name + ' ' + k.creator.surname}"></td>
			<td th:text="${k.overlooker.name + ' ' + k.overlooker.surname}"></td>
            <td>
                <a class="btn" th:href="@{/admin/kpi/show/{id}(id=${k.idKPI})}">View</a>
                <a class="btn" th:href="@{/admin/kpi/update/{id}(id=${k.idKPI})}">Edit</a>
                <a class="btn" th:href="@{/admin/kpi/remove/{id}(id=${k.idKPI})}">Delete</a>
            </td>
        </tr>
    </table>
</div>

<div class="footer">
    <div>Director: Isaac Newton</div>
    <div>Office Manager: Marie Curie</div>
</div>

</body>
</html>
