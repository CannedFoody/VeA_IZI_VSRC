<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Filter Tasks</title>
    <style>
        body { font-family: Arial, sans-serif; background: white; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .content { flex: 1; } h1 { text-align: center; margin-top: 30px; font-size: 26px; font-weight: bold; }
        form { width: 90%; margin: 20px auto; display: flex; gap: 15px; align-items: center; justify-content: center; }
        select, button { padding: 6px 10px; font-size: 14px; }
        button { background: black; color: white; border: none; border-radius: 4px; cursor: pointer; }
        table { width: 90%; margin: 20px auto 40px auto; border-collapse: collapse; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 10px; } th { background: #f5f5f5; }
        .info { text-align: center; margin: 15px; }
        .footer { padding: 20px; font-size: 12px; color: #444; text-align: center; border-top: 1px solid #ddd; }
    </style>
</head>

<body>

<header style="display:flex;align-items:center;justify-content:space-between;padding:12px 25px;border-bottom:1px solid #ddd;">
    <div style="display:flex;align-items:center;gap:15px;">
        <div style="width:40px;height:40px;border-radius:50%;border:1px solid #000;display:flex;align-items:center;justify-content:center;font-size:12px;">Logo</div>
        <div style="font-size:20px;font-weight:bold;">VeA SR Sistēma</div>
    </div>

    <nav style="display:flex;gap:25px;font-size:15px;">
        <span>Access</span>
        <span>Structure</span>
        <span>KPI</span>
        <span style="font-weight:bold;">TASKS</span>
    </nav>

    <div style="display:flex;align-items:center;gap:15px;">
        <span style="font-size:18px;">↪</span>
    </div>
</header>

<div class="content">
    <h1>FILTER TASKS</h1>

    <form th:action="@{/admin/task/filter}" method="get">
        <label for="status">Status:</label>
        <select id="status" name="status">
            <option value="">Any</option>
            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                    th:selected="${s == selectedStatus}"></option>
        </select>

        <label for="kpiId">KPI:</label>
        <select id="kpiId" name="kpiId">
            <option value="">Any</option>
            <option th:each="k : ${kpis}" th:value="${k.idKPI}" th:text="${k.title}"
                    th:selected="${selectedKpiId != null and k.idKPI == selectedKpiId}"></option>
        </select>

        <button type="submit">Filter</button>
    </form>

    <div class="info" th:if="${!searched}">Choose a status and/or a KPI and press Filter.</div>

    <div th:if="${searched}">
        <div class="info">Found <strong th:text="${#lists.size(tasks)}"></strong> task(s).</div>

        <table th:if="${!#lists.isEmpty(tasks)}">
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Description</th>
                <th>Status</th>
                <th>KPI</th>
                <th>SubCategory</th>
            </tr>
            <tr th:each="t : ${tasks}">
                <td th:text="${t.idTask}"></td>
                <td th:text="${t.title}"></td>
                <td th:text="${t.description}"></td>
                <td th:text="${t.status}"></td>
                <td th:text="${t.kpi?.title}"></td>
                <td th:text="${t.subCategory?.title}"></td>
            </tr>
        </table>
    </div>
</div>

<div class="footer">
    <div>Director: Isaac Newton</div>
    <div>Office Manager: Marie Curie</div>
</div>

</body>
</html>
