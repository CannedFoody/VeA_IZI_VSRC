<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Search SubCategories</title>
    <style>
        body { font-family: Arial, sans-serif; background: white; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .content { flex: 1; }
        h1 { text-align: center; margin-top: 30px; font-size: 26px; font-weight: bold; }
        form { text-align: center; margin: 20px 0; }
        input[type=text] { padding: 6px; width: 250px; }
        button { padding: 6px 12px; background: black; color: white; border: none; border-radius: 4px; cursor: pointer; }
        table { width: 90%; margin: 20px auto 40px auto; border-collapse: collapse; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 10px; }
        th { background: #f5f5f5; }
        .message { text-align: center; color: #444; }
        .footer { padding: 20px; font-size: 12px; color: #444; text-align: center; border-top: 1px solid #ddd; }
    </style>
</head>

<body>

<div class="content">
    <h1>SEARCH SUBCATEGORIES</h1>

    <form th:action="@{/admin/subcategory/search}" method="get">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="Title contains...">
        <button type="submit">Search</button>
    </form>

    <p class="message" th:if="${!searched}">Type a keyword and press Search.</p>
    <p class="message" th:if="${searched and #lists.isEmpty(subcategories)}">No subcategories found.</p>

    <table th:if="${searched and !#lists.isEmpty(subcategories)}">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Description</th>
        </tr>
        <tr th:each="s : ${subcategories}">
            <td th:text="${s.idSubcategory}"></td>
            <td th:text="${s.title}"></td>
            <td th:text="${s.description}"></td>
        </tr>
    </table>
</div>

<div class="footer">
    <div>Director: Isaac Newton</div>
    <div>Office Manager: Marie Curie</div>
</div>

</body>
</html>
